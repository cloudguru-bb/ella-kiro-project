version: '3.8'

services:
  ella-core:
    image: ghcr.io/ella-core/ella-core:v0.1.0
    container_name: ella-core
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "38412:38412/sctp"  # N2 / NGAP signaling port
      - "2152:2152/udp"     # N3 / GTP-U user plane port
      - "8080:8080/tcp"    # Management REST API & Health Check
    environment:
      - MCC=999
      - MNC=70
      - TAC=1
      - SUBNET=10.45.0.0/16
      - LOG_LEVEL=info
    volumes:
      - ./ella-core.yaml:/etc/ella/ella-core.yaml:ro
      - ella-db:/var/lib/ella
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.75'
        reservations:
          memory: 128M
          cpus: '0.25'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ella-db:
    driver: local
