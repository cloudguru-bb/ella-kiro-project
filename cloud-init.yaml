#cloud-config
package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - iptables
  - net-tools
  - python3-pip
  - python3-venv

write_files:
  - path: /etc/sysctl.d/99-ella-core.conf
    owner: root:root
    permissions: '0644'
    content: |
      net.ipv4.ip_forward=1
      net.ipv6.conf.all.disable_ipv6=1

  - path: /etc/systemd/system/ella-tun.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Ensure /dev/net/tun device exists for ella-core
      Before=docker.service

      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c 'mkdir -p /dev/net && [ ! -c /dev/net/tun ] && mknod /dev/net/tun c 10 200 && chmod 0666 /dev/net/tun || true'
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/ella-nat.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Set up iptables NAT masquerade for cellular UE user plane egress
      After=network.target

      [Service]
      Type=oneshot
      ExecStart=/sbin/iptables -t nat -A POSTROUTING -s 10.45.0.0/16 ! -o ogstun -j MASQUERADE
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target

  - path: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
    owner: root:root
    permissions: '0644'
    content: |
      {
        "agent": {
          "metrics_collection_interval": 60,
          "run_as_user": "root"
        },
        "logs": {
          "logs_collected": {
            "files": {
              "collect_list": [
                {
                  "file_path": "/var/lib/docker/containers/*/*-json.log",
                  "log_group_name": "/aws/ec2/ella-core",
                  "log_stream_name": "{instance_id}",
                  "timestamp_format": "%Y-%m-%dT%H:%M:%S.%fZ"
                }
              ]
            }
          }
        }
      }

runcmd:
  # Apply sysctl settings for kernel IP forwarding
  - sysctl --system

  # Enable and start TUN device and NAT services
  - systemctl daemon-reload
  - systemctl enable --now ella-tun.service
  - systemctl enable --now ella-nat.service

  # Install Docker Engine & Docker Compose CLI
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update -y
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  # Install AWS CloudWatch Agent (Free Tier metrics & logging)
  - curl -o /tmp/amazon-cloudwatch-agent.deb https://amazoncloudwatch-agent.s3.amazonaws.com/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb
  - dpkg -i -E /tmp/amazon-cloudwatch-agent.deb
  - /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s

  # Prepare Application & Agent Directories
  - mkdir -p /opt/ella/app /opt/ella/agent
  - chown -R ubuntu:ubuntu /opt/ella
