pipeline:
  id: pipeline_cloudguru_bb_ella_kiro_project_build_565c
  name: pipeline_cloudguru_bb_ella_kiro_project_build_565c
  description: Builds and tests the Ella MCP server, scans it for vulnerabilities, publishes the image to Harness Artifact Registry, and generates an SBOM.
  notifications:
    - id: notify_on_failure
      name: Notify on pipeline failure
      on:
        - pipeline: failed
      uses: email
      with:
        recipients:
          - brianlbaird@gmail.com
  stages:
    - id: build_and_test
      name: Build and Test
      runtime: cloud
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - id: install_and_test
          name: Install Dependencies and Run Tests
          run:
            container:
              image: python:3.12
            shell: bash
            script: |-
              cd agent
              python3 -m pip install -r requirements.txt
              python3 ella_mcp_server.py --test
          timeout: 15m
        - id: bandit_scan
          name: Bandit Security Scan
          sto:
            uses: banditStep
        - id: build_and_push
          name: Build and Push Image
          build:
            uses: buildAndPushToHAR
            with:
              registry: harness-native-registry-ctibd7uhtj-9jsjk_girwg
              package_name: bb-ella-mcp-server
              tags:
                - ella-core
                - ${{ codebase.commitSha }}
        - id: generate_sbom
          name: Generate SBOM
          template:
            uses: sbomOrchestrationStep
            with:
              mode: generation
              tool: Syft
              format: spdx-json
              source: artifact-registry
              artifact_registry: harness-native-registry-ctibd7uhtj-9jsjk_girwg/bb-ella-mcp-server
  tags:
    onboarding: "true"
    ai_generated: ""
