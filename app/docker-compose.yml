# ella-core container stack.
#
# Uses the official upstream image from the `ellanetworks` org. Ella Core is a
# Rockcraft/Pebble-based image whose entrypoint is `core --config <file>`; it
# serves its REST API + UI on port 5002 and attaches its user-plane datapath via
# eBPF (XDP/TCX) directly to host network interfaces — so it needs host
# networking and elevated privileges.
#
# Config schema reference: https://github.com/ellanetworks/core (config/core.yaml)
services:
  ella-core:
    image: ghcr.io/ellanetworks/ella-core:v1.19.0
    container_name: ella-core
    restart: unless-stopped
    command: ["core", "--config", "/config/config.yaml"]

    # The eBPF/TCX datapath must attach to the host's real interfaces (n3/n6),
    # which requires host networking and privileged mode (matches upstream k8s
    # core-statefulset.yaml: securityContext.privileged = true).
    network_mode: host
    privileged: true

    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - BPF
      - SYS_RESOURCE

    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ella-data:/core/data

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.75'
        reservations:
          memory: 128M
          cpus: '0.25'

    # /api/v1/metrics is an unauthenticated endpoint (Prometheus text) on :5002,
    # usable as a liveness probe.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5002/api/v1/metrics >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  ella-data:
    driver: local
