#cloud-config
package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - iptables
  - net-tools
  - git
  - python3
  - python3-pip
  - python3-venv

write_files:
  - path: /etc/sysctl.d/99-ella-core.conf
    owner: root:root
    permissions: '0644'
    content: |
      net.ipv4.ip_forward=1
      net.ipv6.conf.all.disable_ipv6=1

  # NOTE: Ella Core manages its own user-plane datapath via eBPF (XDP/TCX)
  # attached to the host interfaces — it does NOT use a kernel `ogstun` TUN
  # device or Open5GS-style iptables. We therefore only enable IP forwarding and
  # a generic egress masquerade for UE internet access; no `ogstun` service.

  - path: /etc/systemd/system/ella-nat.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Masquerade UE user-plane egress out the primary interface
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      # Masquerade traffic leaving the primary interface so UE data egresses to
      # the internet. $IFACE is resolved to the default-route interface at runtime.
      ExecStart=/bin/sh -c 'IFACE=$(ip route show default | awk "/default/ {print \$5; exit}"); /sbin/iptables -t nat -C POSTROUTING -o "$IFACE" -j MASQUERADE 2>/dev/null || /sbin/iptables -t nat -A POSTROUTING -o "$IFACE" -j MASQUERADE'
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/ella-agent.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Ella Day-2 Observability & Self-Healing Agent
      After=docker.service
      Requires=docker.service

      [Service]
      Type=simple
      WorkingDirectory=/opt/ella/agent
      Environment=ELLA_MEMORY_DB=/var/lib/ella-agent/memory.db
      Environment=ELLA_APPROVAL_FILE=/var/lib/ella-agent/approval_pending.json
      EnvironmentFile=-/etc/ella-agent/telegram.env
      ExecStart=/opt/ella/agent/venv/bin/python /opt/ella/agent/self_healing_loop.py
      Restart=always
      RestartSec=10

      [Install]
      WantedBy=multi-user.target

  - path: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
    owner: root:root
    permissions: '0644'
    content: |
      {
        "agent": {
          "metrics_collection_interval": 60,
          "run_as_user": "root"
        },
        "logs": {
          "logs_collected": {
            "files": {
              "collect_list": [
                {
                  "file_path": "/var/lib/docker/containers/*/*-json.log",
                  "log_group_name": "/aws/ec2/ella-core",
                  "log_stream_name": "{instance_id}",
                  "timestamp_format": "%Y-%m-%dT%H:%M:%S.%fZ"
                }
              ]
            }
          }
        }
      }

runcmd:
  # Apply sysctl settings for kernel IP forwarding
  - sysctl --system

  # Enable IP forwarding + UE egress masquerade (ella-core owns its own datapath)
  - systemctl daemon-reload
  - systemctl enable --now ella-nat.service

  # Install Docker Engine & Docker Compose CLI
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - chmod a+r /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update -y
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  # Install AWS CloudWatch Agent (Free Tier metrics & logging)
  - curl -o /tmp/amazon-cloudwatch-agent.deb https://amazoncloudwatch-agent.s3.amazonaws.com/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb
  - dpkg -i -E /tmp/amazon-cloudwatch-agent.deb
  - /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s

  # Prepare Application & Agent Directories
  - mkdir -p /opt/ella/app /opt/ella/agent /var/lib/ella-agent /etc/ella-agent
  - chown -R ubuntu:ubuntu /opt/ella

  # Fetch the project (public repo) and stage app + agent files
  - git clone --depth 1 https://github.com/cloudguru-bb/ella-kiro-project.git /opt/ella/src
  - cp /opt/ella/src/app/docker-compose.yml /opt/ella/app/docker-compose.yml
  - cp /opt/ella/src/app/config.yaml /opt/ella/app/config.yaml
  - cp /opt/ella/src/agent/ella_mcp_server.py /opt/ella/agent/ella_mcp_server.py
  - cp /opt/ella/src/agent/self_healing_loop.py /opt/ella/agent/self_healing_loop.py
  - cp /opt/ella/src/agent/requirements.txt /opt/ella/agent/requirements.txt

  # Deploy the ella-core container stack (Spec 2.5)
  - cd /opt/ella/app && docker compose up -d

  # Create the Python virtualenv for the MCP agent + self-healing loop (Spec 2.1)
  - python3 -m venv /opt/ella/agent/venv
  - /opt/ella/agent/venv/bin/pip install --upgrade pip
  - /opt/ella/agent/venv/bin/pip install -r /opt/ella/agent/requirements.txt
  - chown -R ubuntu:ubuntu /opt/ella /var/lib/ella-agent

  # Start the autonomous Day-2 self-healing agent (Spec 5.2)
  - systemctl daemon-reload
  - systemctl enable --now ella-agent.service
